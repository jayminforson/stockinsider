services:
  - type: web
    name: stockinsider-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: STOCKINSIDER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: MANSA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
